<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>安装 Claude Code</title>
    <style>
      :root {
        --bg: #0f1115;
        --bg-2: #14171e;
        --bg-3: #1a1e27;
        --border: #242935;
        --text: #e6e8ee;
        --text-dim: #8d94a6;
        --text-faint: #5c6377;
        --accent: #d97757;
        --green: #4ade80;
        --red: #f87171;
        --yellow: #fbbf24;
        --blue: #6aa9ff;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      header {
        padding: 20px 24px 14px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .sub {
        color: var(--text-dim);
        font-size: 12px;
      }

      .cmd-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-2);
      }

      /* display:flex 会盖掉 hidden 的默认表现，得显式声明 */
      .cmd-row[hidden] {
        display: none;
      }

      .cmd-row .tag {
        flex: none;
        padding: 1px 7px;
        border-radius: 5px;
        background: rgba(217, 119, 87, 0.14);
        color: var(--accent);
        font-size: 11px;
        font-weight: 600;
      }

      .cmd-row code {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--text);
        word-break: break-all;
        user-select: all;
      }

      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 14px 24px 0;
      }

      .log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0b0d11;
        font-family: var(--mono);
        font-size: 11.5px;
        line-height: 1.65;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .log .line {
        color: #a9b1c3;
      }

      .log .line.err {
        color: var(--red);
      }

      .log .line.sys {
        color: var(--accent);
      }

      .log .line.ok {
        color: var(--green);
      }

      .log .empty {
        color: var(--text-faint);
      }

      footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px 18px;
      }

      .status {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: var(--text-dim);
      }

      .status b {
        font-weight: 600;
      }

      .status.running {
        color: var(--yellow);
      }

      .status.checking {
        color: var(--text-dim);
      }

      .status.present {
        color: var(--blue);
      }

      .status.success {
        color: var(--green);
      }

      .status.error {
        color: var(--red);
      }

      button {
        flex: none;
        padding: 7px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-3);
        color: var(--text);
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #232936;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      button.primary {
        border-color: transparent;
        background: var(--accent);
        color: #16090a;
        font-weight: 600;
      }

      button.primary:hover:not(:disabled) {
        background: #e28565;
      }

      .spin {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 6px;
        border: 2px solid rgba(251, 191, 36, 0.25);
        border-top-color: var(--yellow);
        border-radius: 50%;
        vertical-align: -1px;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>安装 Claude Code</h1>
      <div class="sub">
        先检查本机是否已经装了，只有确实没有才安装。<br />
        有 npm 就装进应用私有目录（不写全局、不改 PATH、不需要 sudo），没有才用官方脚本。
      </div>
      <div class="cmd-row" id="cmdRow">
        <span class="tag" id="methodTag">官方脚本</span>
        <code id="cmd">—</code>
      </div>
    </header>

    <main>
      <div class="log" id="log"><div class="empty">等待开始…</div></div>
    </main>

    <footer>
      <div class="status" id="status">准备中</div>
      <button id="btnSwitch" disabled>改用 npm</button>
      <button id="btnDocs">安装文档</button>
      <button id="btnClose">关闭</button>
    </footer>

    <script>
      const api = window.buddy && window.buddy.install;
      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const cmdEl = document.getElementById("cmd");
      const cmdRow = document.getElementById("cmdRow");
      const tagEl = document.getElementById("methodTag");
      const btnSwitch = document.getElementById("btnSwitch");
      const btnDocs = document.getElementById("btnDocs");
      const btnClose = document.getElementById("btnClose");

      let method = "script";
      let phase = "idle";
      let hasOutput = false;

      // 路径太长会把状态栏撑满，家目录折成 ~
      const short = (p) => String(p || "").replace(/^\/Users\/[^/]+/, "~");

      function appendLine({ stream, text }) {
        if (!hasOutput) {
          logEl.innerHTML = "";
          hasOutput = true;
        }
        const div = document.createElement("div");
        div.className = "line" + (stream && stream !== "out" ? " " + stream : "");
        div.textContent = text;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setStatus(phaseName, html) {
        phase = phaseName;
        statusEl.className = "status " + phaseName;
        statusEl.innerHTML = html;
        const busy = phaseName === "running" || phaseName === "checking";
        btnSwitch.disabled = busy || phaseName === "success" || phaseName === "present";
        btnSwitch.textContent = method === "script" ? "改用 npm" : "改用官方脚本";
      }

      if (!api) {
        setStatus("error", "无法连接主进程（preload 未加载）");
      } else {
        api.onLog(appendLine);

        api.onState((s) => {
          if (s.method) {
            method = s.method;
            tagEl.textContent = s.label || method;
          }
          if (s.cmd) cmdEl.textContent = s.cmd;

          if (s.phase === "checking") {
            setStatus("checking", '<span class="spin"></span>正在检查本机是否已安装…');
            cmdRow.hidden = true; // 还没决定装不装，没命令可显示
          } else if (s.phase === "running") {
            setStatus("running", '<span class="spin"></span>正在安装，请勿关闭窗口…');
            cmdRow.hidden = false;
          } else if (s.phase === "present") {
            setStatus("present", "本机已装，无需安装：<b>" + short(s.bin) + "</b>");
            cmdRow.hidden = true;
            btnClose.textContent = "完成";
            btnClose.classList.add("primary");
          } else if (s.phase === "success") {
            setStatus("success", "安装完成，已找到 <b>" + short(s.bin) + "</b>。关闭本窗口即可开始对话。");
            cmdRow.hidden = false;
            btnClose.textContent = "完成";
            btnClose.classList.add("primary");
          } else if (s.phase === "error") {
            setStatus("error", s.message + "（可切换另一种方式重试）");
            cmdRow.hidden = false;
          }
        });

        btnSwitch.addEventListener("click", () => {
          hasOutput = false;
          logEl.innerHTML = "";
          api.start(method === "script" ? "npm" : "script");
        });

        btnDocs.addEventListener("click", () => api.docs());

        btnClose.addEventListener("click", () => api.close());
      }
    </script>
  </body>
</html>
